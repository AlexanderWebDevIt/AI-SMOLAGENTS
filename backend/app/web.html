<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }

        .header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0f3460; }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header select { background: #0f3460; color: #eee; border: 1px solid #533483; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .status { margin-left: auto; font-size: 12px; color: #4ecca3; }
        .status.offline { color: #e74c3c; }

        .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-wrap: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #533483; border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: #16213e; border-bottom-left-radius: 4px; border: 1px solid #0f3460; }
        .msg.error { background: #e74c3c22; border: 1px solid #e74c3c; color: #e74c3c; }

        .input-area { padding: 16px 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
        .input-area textarea { flex: 1; background: #1a1a2e; color: #eee; border: 1px solid #0f3460; border-radius: 8px; padding: 12px; font-size: 14px; resize: none; font-family: inherit; min-height: 44px; max-height: 120px; }
        .input-area textarea:focus { outline: none; border-color: #533483; }
        .input-area button { background: #533483; color: #eee; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .input-area button:hover { background: #6b44a8; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        .typing { display: flex; gap: 4px; padding: 12px 16px; }
        .typing span { width: 8px; height: 8px; background: #533483; border-radius: 50%; animation: bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

        .welcome { text-align: center; margin: auto; color: #666; }
        .welcome h2 { font-size: 24px; margin-bottom: 8px; color: #533483; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Agent</h1>
        <select id="modelSelect">
            <option>Загрузка моделей...</option>
        </select>
        <span class="status" id="status">●</span>
    </div>

    <div class="chat" id="chat">
        <div class="welcome">
            <h2>AI Agent</h2>
            <p>Напишите сообщение для начала диалога</p>
        </div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button id="sendBtn" onclick="send()">Отправить</button>
    </div>

    <script>
        const API = 'http://localhost:8000';
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');
        const statusEl = document.getElementById('status');
        let sessionId = 'web-' + Date.now();
        let welcomeEl = chat.querySelector('.welcome');

        async function loadModels() {
            try {
                const res = await fetch(`${API}/api/models`);
                const data = await res.json();
                modelSelect.innerHTML = '';
                data.models.filter(m => m.type === 'chat').forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.name;
                    if (m.id === data.active_model) opt.selected = true;
                    modelSelect.appendChild(opt);
                });
                statusEl.className = 'status';
                statusEl.textContent = '● подключено';
            } catch (e) {
                statusEl.className = 'status offline';
                statusEl.textContent = '● оффлайн';
            }
        }

        modelSelect.addEventListener('change', async () => {
            await fetch(`${API}/api/models/select`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({model_id: modelSelect.value})
            });
        });

        function addMsg(text, type) {
            if (welcomeEl) { welcomeEl.remove(); welcomeEl = null; }
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function showTyping() {
            if (welcomeEl) { welcomeEl.remove(); welcomeEl = null; }
            const div = document.createElement('div');
            div.className = 'msg bot typing';
            div.id = 'typing';
            div.innerHTML = '<span></span><span></span><span></span>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch(`${API}/api/agent/run`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text, session_id: sessionId, model: modelSelect.value})
                });
                const data = await res.json();
                removeTyping();
                if (data.error) {
                    addMsg(data.error, 'error');
                } else {
                    addMsg(data.reply, 'bot');
                }
            } catch (e) {
                removeTyping();
                addMsg('Ошибка соединения с сервером', 'error');
            }
            sendBtn.disabled = false;
            input.focus();
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        loadModels();
    </script>
</body>
</html>
